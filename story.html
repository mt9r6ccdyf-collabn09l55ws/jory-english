<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jory English 🎀</title>

  <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="topbar">

  <a
    href="index.html"
    class="brand"
  >
    🎀 Jory English
  </a>


  <div class="topbar-actions">

    <a
      href="a1.html"
      class="pill-btn"
    >
      ← القصص
    </a>

    <button
      id="langToggle"
      class="pill-btn"
    >
      🌐 EN
    </button>

    <button
      id="themeToggle"
      class="pill-btn"
    >
      🌓
    </button>

  </div>

</header>


<main class="container story-page">


  <section class="story-header">

    <div>

      <div
        class="hero-badge"
        id="storyLevel"
      >
        A1
      </div>


      <h1 id="storyTitle">
        القصة
      </h1>


      <p id="storySubtitle"></p>

    </div>


    <button
      class="listen-main"
      id="listenSentence"
    >
      🔊 استماع
    </button>

  </section>



  <section class="progress-card">

    <div class="section-title">

      <span id="sentenceCount">
        الجملة 1 من 1
      </span>

      <strong id="storyPercent">
        0%
      </strong>

    </div>


    <div class="bar-track">

      <div
        class="bar-fill"
        id="storyBar"
      ></div>

    </div>

  </section>



  <section class="learning-card">


    <div class="word-card">

      <span>
        الكلمة الحالية
      </span>


      <strong id="currentWord">
        ابدئي بالكتابة…
      </strong>


      <small id="currentMeaning">
        ستظهر ترجمة الكلمة هنا
      </small>

    </div>



    <div class="input-wrap">

      <div
        class="ghost"
        id="ghostText"
      ></div>


      <textarea
        id="typingInput"
        rows="3"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="اكتبي الجملة الإنجليزية هنا…"
      ></textarea>

    </div>



    <div class="controls">


      <button
        class="secondary-btn"
        id="ipaBtn"
      >
        🔤 IPA
      </button>


      <button
        class="secondary-btn"
        id="replayBtn"
      >
        🔊 إعادة
      </button>


      <button
        class="next-btn"
        id="nextBtn"
        disabled
      >
        التالي →
      </button>

    </div>



    <div
      class="ipa-box"
      id="ipaBox"
    ></div>



    <div
      class="sentence-translation"
      id="sentenceTranslation"
    ></div>



    <div
      class="success"
      id="successMsg"
    >
      🎉 Excellent!
    </div>

  </section>



  <section class="tip-card">

    <strong>
      💡 Tip
    </strong>

    <p>
      اكتبي الجملة كما تظهر أمامك. عند إكمالها بشكل صحيح سيتفعّل زر Next.
    </p>

  </section>


</main>


<script src="js/storiesData.js"></script>
<script src="js/app.js"></script>

<script>

  Jory.initTopbar();

  Jory.initStory();

</script>


</body>

</html>
