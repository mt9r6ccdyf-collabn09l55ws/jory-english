<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Story | Jory English 🎀</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="container header-content">

      <a href="../index.html" class="logo">
        Jory English 🎀
      </a>

      <div class="global-controls">

        <button
          id="languageToggle"
          class="control-button"
          type="button">
          🇸🇦 العربية
        </button>

        <button
          id="themeToggle"
          class="control-button"
          type="button">
          🌙 Dark
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       STORY PAGE
  ========================== -->

  <main class="story-page">

    <div class="container story-container">


      <!-- Back -->

      <a
        id="backToLevel"
        href="level.html?level=A1"
        class="back-button">

        ← Back to A1

      </a>


      <!-- =========================
           STORY HEADER
      ========================== -->

      <section class="story-top">

        <div
          id="storyEmoji"
          class="story-page-emoji">
          🌅
        </div>

        <span
          id="storyLevel"
          class="story-level">
          A1
        </span>

        <h1 id="storyTitle">
          My Morning Routine
        </h1>

        <p id="storyDescription">
          A simple story about a morning routine.
        </p>

      </section>


      <!-- =========================
           STORY PROGRESS
      ========================== -->

      <section class="story-progress">

        <div class="story-progress-info">

          <span>
            Story Progress
          </span>

          <span id="sentenceProgressText">
            1 / 5
          </span>

        </div>

        <div class="progress-track">

          <div
            id="sentenceProgressFill"
            class="progress-fill">
          </div>

        </div>

      </section>


      <!-- =========================
           MAIN LEARNING CARD
      ========================== -->

      <section class="story-learning">


        <!-- Sentence number -->

        <div
          id="sentenceNumber"
          class="sentence-number">
          Sentence 1
        </div>


        <!-- =========================
             CURRENT WORD MEANING
        ========================== -->

        <div
          id="currentWordInfo"
          class="current-word-info">

          <div
            id="currentWordMeaning"
            class="current-word-meaning">
            اسمي
          </div>

          <div
            id="currentWordIPA"
            class="current-word-ipa">
          </div>

        </div>


        <!-- =========================
             WORD WRITING AREA
        ========================== -->

        <div
          id="wordWritingArea"
          class="word-writing-area">


          <!-- Original word
               stays faint behind
               the user's writing -->

          <div
            id="ghostWord"
            class="ghost-word">
            My
          </div>


          <!-- User writes here -->

          <input
            id="wordInput"
            class="word-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Type the current word">


        </div>


        <!-- =========================
             WORD FEEDBACK
        ========================== -->

        <div
          id="wordFeedback"
          class="word-feedback"
          aria-live="polite">
        </div>


        <!-- =========================
             SENTENCE PREVIEW
        ========================== -->

        <div
          id="sentencePreview"
          class="sentence-preview">
        </div>


        <!-- =========================
             SENTENCE TRANSLATION
        ========================== -->

        <div
          id="sentenceTranslation"
          class="sentence-translation">
          اسمي لمار.
        </div>


        <!-- =========================
             SENTENCE AUDIO
        ========================== -->

        <button
          id="sentenceAudioButton"
          class="audio-button"
          type="button">

          🔊 Listen to sentence

        </button>


        <!-- =========================
             NEXT SENTENCE
        ========================== -->

        <button
          id="nextSentenceButton"
          class="next-button"
          type="button"
          disabled>

          Next Sentence →

        </button>

      </section>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer">

    <div class="container">

      <p>
        Jory English 🎀
      </p>

    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/story.js"></script>

</body>

</html>
