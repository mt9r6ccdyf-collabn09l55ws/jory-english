<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Story | Jory English 🎀</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <div class="container header-content">

      <a href="../index.html" class="logo">
        Jory English 🎀
      </a>

      <div class="global-controls">

        <button
          id="languageToggle"
          class="control-button"
          type="button">
          🇸🇦 العربية
        </button>

        <button
          id="themeToggle"
          class="control-button"
          type="button">
          🌙 Dark
        </button>

      </div>

    </div>

  </header>


  <!-- STORY -->
  <main class="story-page">

    <div class="container story-container">


      <!-- BACK -->

      <a
        id="backToLevel"
        href="level.html?level=A1"
        class="back-button">

        ← Back to A1

      </a>


      <!-- STORY HEADER -->

      <section class="story-top">

        <div
          id="storyEmoji"
          class="story-page-emoji">
          🌅
        </div>

        <span
          id="storyLevel"
          class="story-level">
          A1
        </span>

        <h1 id="storyTitle">
          My Morning Routine
        </h1>

        <p id="storyDescription">
          A simple story about a morning routine.
        </p>

      </section>


      <!-- PROGRESS -->

      <section class="story-progress">

        <div class="story-progress-info">

          <span id="storyProgressLabel">
            Story Progress
          </span>

          <span id="sentenceProgressText">
            1 / 5
          </span>

        </div>

        <div class="progress-track">

          <div
            id="sentenceProgressFill"
            class="progress-fill">
          </div>

        </div>

      </section>


      <!-- CURRENT SENTENCE -->

      <section class="sentence-learning-card">


        <!-- Sentence number -->

        <div
          id="sentenceNumber"
          class="sentence-number">
          Sentence 1
        </div>


        <!-- Arabic meaning -->

        <div
          id="currentWordMeaning"
          class="current-word-meaning">
          اسمي لمار.
        </div>


        <!-- IPA -->

        <div
          id="currentWordIPA"
          class="current-word-ipa">
        </div>


        <!-- SENTENCE WRITING -->

        <div class="sentence-writing-area">

          <!-- Original sentence behind -->

          <div
            id="ghostSentence"
            class="ghost-sentence">
            My name is Lamar.
          </div>


          <!-- User writes directly over it -->

          <input
            id="sentenceInput"
            class="sentence-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Type the sentence">


        </div>


        <!-- FEEDBACK -->

        <div
          id="typingFeedback"
          class="typing-feedback"
          aria-live="polite">
        </div>


        <!-- AUDIO -->

        <button
          id="sentenceAudioButton"
          class="audio-button"
          type="button">

          🔊 Listen to sentence

        </button>


        <!-- NEXT -->

        <button
          id="nextSentenceButton"
          class="next-button"
          type="button"
          disabled>

          Next →

        </button>


      </section>

    </div>

  </main>


  <!-- FOOTER -->

  <footer class="site-footer">

    <div class="container">

      <p>
        Jory English 🎀
      </p>

    </div>

  </footer>


  <!-- JAVASCRIPT -->

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/story.js"></script>

</body>

</html>
