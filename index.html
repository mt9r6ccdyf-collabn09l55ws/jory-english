<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jory English 🎀</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">

  <a href="index.html" class="brand">
    🎀 Jory English
  </a>

  <div class="topbar-actions">

    <button id="langToggle" class="pill-btn">
      🌐 EN
    </button>

    <button id="themeToggle" class="pill-btn">
      🌓
    </button>

  </div>

</header>


<main class="container">

  <section class="hero">

    <div class="hero-badge">
      Line-by-Line English
    </div>

    <h1 id="tagline">
      تعلمي الإنجليزية سطرًا بسطر 🎀
    </h1>

    <p id="subtitle">
      اختاري مستواكِ وابدئي رحلتك مع القصص التفاعلية.
    </p>

  </section>


  <section class="overall-card">

    <div class="section-title">

      <span id="overallTitle">
        التقدم العام
      </span>

      <strong id="overallText">
        0%
      </strong>

    </div>

    <div class="bar-track">

      <div
        class="bar-fill"
        id="overallBar"
        style="width:0%"
      ></div>

    </div>

  </section>


  <h2 class="page-title" id="levelsTitle">
    اختاري مستواكِ
  </h2>


  <section
    class="level-grid"
    id="levelGrid"
  ></section>

</main>


<script src="js/storiesData.js"></script>
<script src="js/app.js"></script>

<script>

  Jory.initTopbar();

  Jory.renderLevels();

</script>

</body>
</html>
